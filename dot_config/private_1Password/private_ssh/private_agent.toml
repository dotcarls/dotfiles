# 1Password SSH agent allowlist. Entries are ordered so non-Git SSH hosts try
# the corporate key before the EMU and personal keys. GitHub itself selects one
# exact public key through ~/.config/git/ssh_config and IdentitiesOnly.

[[ssh-keys]]
vault = "Employee"
item = "ticarlso@cisco.com"

[[ssh-keys]]
vault = "Employee"
item = "ticarlso_cisco Auth Key"

[[ssh-keys]]
vault = "Employee"
item = "ticarlso_cisco Signing Key"

[[ssh-keys]]
vault = "Employee"
item = "dotcarls Personal Git"

[[ssh-keys]]
vault = "1P-Eng-HyperShield"
item = "hyperadmin SSH Key"

[[ssh-keys]]
vault = "1P-Eng-HyperShield"
item = "hs-dev-eks-use2-1-bastion"
